# Copy to presets/my_lamp.ini. Lines starting with # or ; are comments.
# Strings use double quotes; numbers and firmware symbols do not.
[firmware]
WIFI_MODE = WIFI_STA_MODE
MDNS_NAME = "my_lamp"
WIDTH = 16
HEIGHT = 16
LED_PIN = 5
LED_TYPE = WS2812B
LED_COLOR_ORDER = GRB
CURRENT_LIMIT = 1000
BUTTON = false
MQTT = true
TIME_ZONE = 5.0
WEB_AUTH = true

# Optional: override a shared credential here for this device only.
# WIFI_SSID = "Another network"

[upload]
# OTA defaults to MDNS_NAME + .local. Use the CURRENT address when renaming.
# ota_host = "192.168.1.42"
# Optional serial port; omitted means PlatformIO auto-detection.
# usb_port = "COM3"
# usb_port = "/dev/ttyUSB0"
