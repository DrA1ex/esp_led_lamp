name: Remote Audio firmware CI

on:
  push:
    branches:
      - feature/remote-audio-dsp
  pull_request:
    branches: [main]

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute native parser tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/test_remote_audio_protocol.cpp -o /tmp/remote_audio_parser
          /tmp/remote_audio_parser
      - name: Compile and execute timeline tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/test_remote_audio_timeline.cpp -o /tmp/remote_audio_timeline
          /tmp/remote_audio_timeline
      - name: Validate synthetic sender
        run: python3 -m py_compile tools/remote_audio_sender.py

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile ESP8266 firmware (remote enabled, local microphone disabled)
        run: pio run -e release
