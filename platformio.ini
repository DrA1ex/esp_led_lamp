; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_speed = 460800
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
                  time

lib_deps = fastled/FastLED@^3.6.0
           ESP32Async/ESPAsyncTCP@2.0.0
           ESP32Async/ESPAsyncWebServer@3.12.1
           marvinroger/AsyncMqttClient@^0.9.0
           arduino-libraries/NTPClient@^3.2.1
           bblanchon/ArduinoJson@^7.1.0

[env:debug]
build_type = debug
build_flags = -D DEBUG -D DEBUG_LEVEL=1

[env:release]
build_flags = -O3 -ffp-contract=fast -ffast-math

[env:ota]
extends = env:release
upload_protocol = espota
upload_port = esp_lamp.local

; CI-only regression build: confirm local microphone and remote streaming coexist.
[env:local-audio]
extends = env:release
build_flags = ${env:release.build_flags} -DAUDIO=1
